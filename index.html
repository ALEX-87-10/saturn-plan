<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>土星计划 · 个人工作台</title>
<meta name="description" content="待办、笔记、记账、习惯打卡四合一，纯前端静态站，数据保存在本机浏览器。">
<meta name="theme-color" content="#12100e">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <ellipse cx="24" cy="24" rx="23" ry="7.6" transform="rotate(-20 24 24)" fill="none" stroke="#e7a445" stroke-width="1.6" opacity="0.7"></ellipse>
        <circle cx="24" cy="24" r="11.5" fill="#e7a445" fill-opacity="0.14" stroke="#e7a445" stroke-width="1.4"></circle>
        <path d="M13.4 20.6c4 2.2 12.4 2.6 21.2-1.4" stroke="#e7a445" stroke-width="1.1" opacity="0.55" fill="none"></path>
        <path d="M14 28c4.4 1.6 12 1.2 19.6-3" stroke="#e7a445" stroke-width="1.1" opacity="0.4" fill="none"></path>
      </svg>
      <div class="brand-text">
        <div class="brand-title">土星计划</div>
        <div class="brand-sub">Saturn Plan</div>
      </div>
    </div>

    <nav class="nav" aria-label="主导航">
      <button type="button" class="nav-item is-active" data-route="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3.4 9.6h17.2"/><path d="M8 3.9 9.6 9.6"/><path d="M16 3.9 14.4 9.6"/></svg>
        <span>概览</span>
      </button>
      <button type="button" class="nav-item" data-route="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h10"/><path d="M4 12h10"/><path d="M4 18h7"/><path d="m16.5 16.5 2 2 4-4.5"/></svg>
        <span>待办清单</span>
      </button>
      <button type="button" class="nav-item" data-route="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 12h6"/><path d="M9 16h4"/></svg>
        <span>笔记</span>
      </button>
      <button type="button" class="nav-item" data-route="money">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 11h18"/><circle cx="16.5" cy="15" r="1.4"/></svg>
        <span>记账</span>
      </button>
      <button type="button" class="nav-item" data-route="habits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8h7"/><path d="M5 13h5"/><path d="M5 18h7"/><path d="m15 17 2 2 4-5"/><circle cx="17.5" cy="7.5" r="2.5"/></svg>
        <span>习惯打卡</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div>数据只保存在这台设备的浏览器里，没有账号也没有云同步。换设备前记得先导出一份备份。</div>
      <button type="button" class="btn" id="action-export">导出 JSON 备份</button>
      <button type="button" class="btn" id="action-seed">载入示例数据</button>
      <button type="button" class="btn btn-danger" id="action-reset">清空全部数据</button>
    </div>
  </aside>

  <main class="main" id="view-root"></main>

</div>

<script src="https://fastly.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js" defer onload="window.SaturnChartsReady && window.SaturnChartsReady()"></script>
<script src="assets/js/store.js" defer></script>
<script src="assets/js/ui.js" defer></script>
<script src="assets/js/modules/overview.js" defer></script>
<script src="assets/js/modules/tasks.js" defer></script>
<script src="assets/js/modules/notes.js" defer></script>
<script src="assets/js/modules/money.js" defer></script>
<script src="assets/js/modules/habits.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
